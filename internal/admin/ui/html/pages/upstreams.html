<div id="tab-network" class="tab-panel system-page" style="display:none">
  <span id="tab-upstreams" hidden aria-hidden="true"></span>
  <div class="page-header">
    <div>
      <div class="page-kicker">连接管理</div>
      <div class="large-title">网络与出口</div>
      <div class="large-subtitle">管理默认出口代理。服务专属的代理与请求头请在 Providers 中配置。</div>
    </div>
    <div class="action-row"><button type="button" class="btn btn-sm" onclick="loadGlobal(true);loadClineProxyConfig()">刷新</button></div>
  </div>

  <div class="section system-section">
    <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span>出口配置清单</span></div>
    <div class="section-desc">查看默认出口与服务专属出口；代理地址中的凭据已隐藏。</div>
    <div id="globalNetworkContext" class="network-context" aria-live="polite"></div>
    <div id="globalEgress" class="section-body system-inventory" aria-live="polite"></div>
  </div>
  <div class="section">
    <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>默认出口代理</div>
    <div class="section-desc">Cline、OAuth 登录与刷新，以及未设置出口覆盖的自定义 Provider 使用此代理池。OpenCode Zen 使用服务专属设置；回环与内网服务保持直连。未配置时使用环境代理或直连。</div>
    <div class="section-body">
      <div class="form-row">
        <div class="field w-260">
          <label>代理策略</label>
          <select id="clineProxyStrategy">
            <option value="round_robin">轮询 (round_robin)</option>
            <option value="random">随机 (random)</option>
            <option value="fill">填满 (fill)</option>
          </select>
          <div class="field-hint">仅决定多个出口代理地址之间的选择；Cline 账号轮询与 Provider 评分在 <a href="#" onclick="showPageSubTab('routing', 'config');return false" class="lnk-a">「路由 → 路由策略」</a></div>
        </div>
      </div>
      <div class="field mt-10">
        <label>代理列表</label>
        <textarea id="clineProxies" rows="4" placeholder="socks5://127.0.0.1:1080&#10;http://user:pass@proxy.example.com:8080"></textarea>
      </div>
      <div class="form-actions mt-14">
        <button class="btn btn-primary" onclick="saveClineProxyConfig(this)">保存默认代理</button>
      </div>
      <div id="clineProxySaveResult" class="mt-8" aria-live="polite"></div>
    </div>
  </div>

  <div class="section network-provider-settings-link"><div class="section-title"><span>服务专属网络设置</span></div><div class="section-body"><p class="section-desc">在对应 Provider 的设置中管理专属代理、请求头与认证。</p><button type="button" class="btn" onclick="applyTab('providers')">查看 Providers</button></div></div>
</div>
