<div id="tab-health" class="tab-panel system-page health-page" style="display:none" aria-busy="false">
  <div class="page-header">
    <div>
      <div class="page-kicker">可观测性</div>
      <div class="large-title">Provider 健康与诊断</div>
      <div class="large-subtitle">查看问题范围、冷却截止和重置证据；这是只读快照，不是实时连通性测试。</div>
    </div>
    <div class="action-row health-page-actions">
      <span id="globalHealthUpdated" class="health-updated" role="status"></span>
      <button id="globalHealthRefresh" type="button" class="btn btn-sm" onclick="loadGlobalHealth()">刷新状态</button>
    </div>
  </div>

  <div class="health-toolbar">
    <div class="health-filter">
      <label for="globalHealthProviderFilter">Provider 筛选</label>
      <select id="globalHealthProviderFilter" onchange="setGlobalFilter(this.value)"></select>
    </div>
    <div class="health-filter">
      <label for="globalHealthKindFilter">问题类型</label>
      <select id="globalHealthKindFilter" onchange="setGlobalHealthKind(this.value)">
        <option value="">全部问题</option>
        <option value="auth_expired">认证过期</option>
        <option value="model_gone">模型下架</option>
        <option value="quota_exhausted">配额耗尽</option>
        <option value="rate_limited">限流</option>
        <option value="transient_failure">瞬时故障</option>
      </select>
    </div>
    <div class="health-filter health-search">
      <label for="globalHealthSearch">搜索观察</label>
      <input id="globalHealthSearch" type="search" placeholder="Provider、模型、凭据或证据来源" oninput="setGlobalHealthSearch(this.value)">
    </div>
  </div>

  <div id="globalHealthError" class="health-error" role="alert" hidden></div>
  <div id="globalHealthSummary" class="health-summary-grid" aria-live="polite"></div>
  <div id="globalHealthCredentialNote" class="health-note" role="status" hidden></div>
  <div id="globalHealthRuntime" class="health-runtime" aria-live="polite"></div>

  <details id="globalHealthCredentialIssues" class="health-credential-issues" hidden>
    <summary><span>需关注凭据</span><span id="globalHealthCredentialCount" class="health-issue-count" data-numeric></span></summary>
    <div id="globalHealthCredentials"></div>
  </details>

  <section class="section health-observations" aria-labelledby="globalHealthObservationTitle">
    <div class="health-section-head">
      <h2 id="globalHealthObservationTitle">可用性观察</h2>
      <span id="globalHealthObservationCount" class="health-muted" role="status"></span>
    </div>
    <div id="globalState" aria-live="polite"></div>
  </section>
  <div class="health-footnote">
    <span>回退冷却不是上游配额重置。观察只影响所列范围，不代表整个 Provider 不可用。</span>
    <div class="health-related-links">
      <button type="button" class="text-action" onclick="switchTab('providers')">查看 Provider</button>
      <button type="button" class="text-action" onclick="switchTab('quota')">用量与配额</button>
      <button type="button" class="text-action" onclick="switchTab('logs')">查看请求日志</button>
    </div>
  </div>
</div>
