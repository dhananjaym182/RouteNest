<div id="tab-health" class="tab-panel system-page" style="display:none">
  <div class="page-header">
    <div>
      <div class="page-kicker">Provider 系统</div>
      <div class="large-title">使用与健康</div>
      <div class="large-subtitle">查看运行状态证据，并进入用量、请求日志与预算工具。</div>
    </div>
    <div class="action-row"><button type="button" class="btn btn-sm" onclick="loadGlobal(true)">刷新状态</button></div>
  </div>

  <div class="health-links" aria-label="使用与健康工具">
    <button type="button" class="health-link-card" onclick="switchTab('dashboard')">
      <span class="health-link-index">01</span>
      <strong>用量概览</strong>
      <span>吞吐、延迟、Token 与上游分布</span>
    </button>
    <button type="button" class="health-link-card" onclick="switchTab('logs')">
      <span class="health-link-index">02</span>
      <strong>请求日志</strong>
      <span>逐请求结果、耗时与故障转移</span>
    </button>
    <button type="button" class="health-link-card" onclick="switchTab('quota')">
      <span class="health-link-index">03</span>
      <strong>配额与预算</strong>
      <span>配置预算、用量窗口与冷却恢复</span>
    </button>
  </div>

  <div class="section system-section">
    <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-7 5 14 2.5-7h4"/><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg><span>可用性观察</span></div>
    <div class="section-desc">冷却截止与配额重置分开显示。没有重置证据时明确标为未知，不把回退冷却当作上游重置。</div>
    <div class="system-toolbar">
      <div class="field system-filter-field">
        <label for="globalHealthProviderFilter">Provider 筛选</label>
        <select id="globalHealthProviderFilter" onchange="setGlobalFilter(this.value)"></select>
      </div>
      <div class="state-legend" aria-label="时间证据图例">
        <span class="evidence-key evidence-reset">确认重置</span>
        <span class="evidence-key evidence-fallback">回退冷却</span>
      </div>
    </div>
    <div id="globalState" class="section-body system-inventory" aria-live="polite"></div>
  </div>
</div>
