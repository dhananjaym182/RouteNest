<div id="tab-global" class="tab-panel" style="display:none">

  <div class="section">
    <div class="section-body flush">
      <div id="globalSummary" class="quota-summary"></div>

  </div>
  <div class="section">

      <div style="max-width:360px">
        <label class="quota-label" for="globalProviderFilter">范围</label>
        <select id="globalProviderFilter" onchange="setGlobalFilter(this.value)"></select>

  <div class="section">

    <div id="globalEgress" class="section-body flush"></div>
