<div id="tab-dashboard" class="tab-panel">
  <div class="page-header">
    <div>
      <div class="page-kicker">工作区</div>
      <div class="large-title">概览</div>
      <div class="large-subtitle">网关流量、上游表现、模型分布与需要处理的问题。</div>
    </div>
    <div class="action-row">
      <button class="btn btn-sm" onclick="switchTab('logs')">查看请求日志</button>
      <button class="btn btn-sm btn-primary" onclick="switchTab('providers')">管理 Providers</button>
    </div>
  </div>

  <div class="metric-section">
    <div class="dash-hero" id="dashHero">
      <div class="dash-hero-main">
        <div class="dash-verdict-row">
          <span class="dash-dot" id="dashLiveDot"></span>
          <span class="dash-verdict" id="dashVerdict">加载中…</span>
          <span class="dash-live-badge" id="dashLiveBadge" hidden>LIVE</span>
        </div>
        <div class="dash-count"><b id="dashReqCount">0</b><span id="dashCountLabel">窗口内请求</span></div>
        <div class="dash-ratio" role="img" aria-label="成功失败占比"><span class="ratio-ok" id="dashRatioOk" style="width:100%"></span><span class="ratio-err" id="dashRatioErr" style="width:0%"></span></div>
        <div class="dash-ratio-labels">
          <span class="ok-lbl">✓ <b id="dashOkCount">0</b></span>
          <span class="err-lbl">✕ <b id="dashErrCount">0</b></span>
          <span class="rate-lbl" id="dashRateLabel">—</span>
        </div>
        <div class="dash-ranges" role="group" aria-label="时间窗口">
          <button type="button" class="chip range" data-hours="1" onclick="setDashRange(1, this)">1h</button>
          <button type="button" class="chip range active" data-hours="24" onclick="setDashRange(24, this)">24h</button>
          <button type="button" class="chip range" data-hours="72" onclick="setDashRange(72, this)">3d</button>
          <button type="button" class="chip range" data-hours="168" onclick="setDashRange(168, this)">7d</button>
        </div>
      </div>
      <div class="dash-kpis">
        <div class="dash-kpi"><div class="kpi-num" id="dashKpiLatency">—</div><div class="kpi-label">平均时延</div><div class="kpi-meter"><span id="dashMeterLatency"></span></div></div>
        <div class="dash-kpi"><div class="kpi-num" id="dashKpiTtft">—</div><div class="kpi-label">首字延迟</div><div class="kpi-meter"><span id="dashMeterTtft"></span></div></div>
        <div class="dash-kpi"><div class="kpi-num" id="dashKpiTokens">—</div><div class="kpi-label">窗口 Token</div><div class="kpi-meter"><span id="dashMeterTokens"></span></div></div>
        <div class="dash-kpi"><div class="kpi-num" id="dashKpiFallback">—</div><div class="kpi-label">降级切换</div><div class="kpi-meter"><span id="dashMeterFallback"></span></div></div>
      </div>
    </div>
  </div>

  <div class="metric-section">
    <div class="overview-section-head">
      <div class="metric-heading">请求流量</div>
      <button class="btn btn-sm" onclick="switchTab('logs')">打开调试控制台</button>
    </div>
    <div class="dash-chart" id="dashThroughput"><div class="sk-stack"><span class="skeleton"></span></div></div>
  </div>

  <div class="metric-section">
    <div class="dash-grid">
      <div class="dash-col">
        <div class="metric-heading">Provider 流量与成功率</div>
        <div class="dash-fleet" id="dashFleet"><div class="sk-stack"><span class="skeleton"></span><span class="skeleton w70"></span></div></div>
        <div class="dash-runtime" id="dashRuntime"></div>
      </div>
      <div class="dash-col">
        <div class="metric-heading">热门模型</div>
        <div class="dash-models" id="dashModels"><div class="sk-stack"><span class="skeleton"></span><span class="skeleton w70"></span></div></div>
      </div>
    </div>
  </div>

  <div class="metric-section">
    <div class="overview-section-head">
      <div class="metric-heading">近期请求</div>
      <button class="btn btn-sm" onclick="switchTab('logs')">查看全部</button>
    </div>
    <div class="dash-activity" id="dashActivity" aria-live="polite"><div class="sk-stack"><span class="skeleton"></span><span class="skeleton w70"></span></div></div>
  </div>

  <div class="metric-section">
    <div class="overview-section-head">
      <div class="metric-heading">需要关注</div>
      <button class="btn btn-sm" onclick="switchTab('health')">Provider 健康</button>
    </div>
    <div class="attention-list" id="dashAttention" aria-live="polite"><div class="sk-stack"><span class="skeleton"></span><span class="skeleton w70"></span></div></div>
  </div>

  <div class="section">
    <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>常用操作</div>
    <div class="section-desc">直接进入现有管理工作流，操作语义与后端行为保持一致。</div>
    <div class="section-body action-row">
      <button class="btn btn-primary" onclick="showAccountLogin('oauth')">添加 Cline 账号</button>
      <button class="btn" onclick="switchTab('providers')">添加 Provider</button>
      <button class="btn" onclick="switchTab('combos')">配置路由组合</button>
      <button class="btn" onclick="switchTab('security');switchPageSubTab('security','keys')">生成 API 密钥</button>
    </div>
  </div>
</div>
