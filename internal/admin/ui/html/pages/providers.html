<div id="tab-providers" class="tab-panel system-page" style="display:none">
  <div class="page-header">
    <div>
      <div class="page-kicker">Provider 系统</div>
      <div class="large-title">Providers</div>
      <div class="large-subtitle">查看所有可路由上游及其已知能力，再按需管理自定义 Provider。</div>
    </div>
    <div class="action-row">
      <button type="button" class="btn btn-sm" onclick="loadGlobal(true);loadProviders()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>刷新</button>
    </div>
  </div>
  <div class="system-hero">
    <div class="system-hero-copy">
      <span class="system-hero-label">全局清单</span>
      <h2>一个 Provider 视图，覆盖全部上游</h2>
      <p>能力状态来自运行时定义；未知与不支持不会被隐藏或猜测。</p>
    </div>
    <div id="globalSummary" class="system-summary" aria-live="polite"></div>
  </div>
  <div class="section system-section">
    <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span>Provider 清单</span></div>
    <div class="section-desc">内置与自定义上游统一展示。打开关联视图时会保留当前 Provider 筛选。</div>
    <div class="system-toolbar">
      <div class="field system-filter-field">
        <label for="globalProviderFilter">Provider 筛选</label>
        <select id="globalProviderFilter" onchange="setGlobalFilter(this.value)"></select>
      </div>
      <div class="capability-legend" aria-label="能力状态图例">
        <span class="capability-state capability-supported">支持</span>
        <span class="capability-state capability-unsupported">不支持</span>
        <span class="capability-state capability-unknown">未知</span>
      </div>
    </div>
    <div id="globalInstances" class="section-body system-inventory" aria-live="polite"></div>
  </div>
  <div class="section legacy-workspace">
    <div class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg><span>自定义 Provider 管理</span>
      <span class="title-tools">
        <button class="btn btn-sm" onclick="loadProviderPresets()">从预设添加 Provider</button>
        <button class="btn btn-sm btn-primary" onclick="showProviderEditor()">＋ 添加 Provider</button>
      </span>
    </div>
    <div class="section-desc">添加、测试与编辑 OpenAI 兼容上游。凭据、模型和网络状态分别在对应全局视图中查看。</div>
    <div id="providerSyncBanner" class="sync-banner" aria-live="polite"></div>
    <div class="section-body">
      <div id="providersList"></div>
    </div>
  </div>
</div>
