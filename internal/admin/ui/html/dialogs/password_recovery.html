<div id="passwordRecoveryOverlay" class="overlay-modal" style="display:none">
  <section class="recovery-dialog" role="dialog" aria-modal="true" aria-labelledby="passwordRecoveryTitle" aria-describedby="passwordRecoveryHelp" tabindex="-1">
    <button type="button" class="modal-close" onclick="closePasswordRecovery()" aria-label="关闭">×</button>
    <div id="passwordRecoveryFormView">
      <div class="page-kicker">管理员恢复</div>
      <h2 id="passwordRecoveryTitle">重置管理员密码</h2>
      <p id="passwordRecoveryHelp">输入安装时保存的恢复码，并创建新的管理员密码。</p>
      <form id="passwordRecoveryForm" novalidate onsubmit="event.preventDefault();submitPasswordRecovery()">
        <div class="field"><label for="passwordRecoveryCode">恢复码</label><input id="passwordRecoveryCode" type="password" autocomplete="one-time-code" spellcheck="false" required aria-describedby="passwordRecoveryError"></div>
        <div class="field"><label for="passwordRecoveryNewPassword">新密码</label><input id="passwordRecoveryNewPassword" type="password" minlength="8" maxlength="1024" autocomplete="new-password" required aria-describedby="passwordRecoveryError"></div>
        <div class="field"><label for="passwordRecoveryConfirmPassword">确认新密码</label><input id="passwordRecoveryConfirmPassword" type="password" minlength="8" maxlength="1024" autocomplete="new-password" required aria-describedby="passwordRecoveryError"></div>
        <div id="passwordRecoveryError" class="login-err" role="alert" aria-live="assertive"></div>
        <div class="modal-actions"><button type="button" class="btn" onclick="closePasswordRecovery()">取消</button><button id="passwordRecoverySubmit" type="submit" class="btn btn-primary">重置密码</button></div>
      </form>
    </div>
    <div id="passwordRecoveryResultView" hidden>
      <div class="page-kicker">恢复完成</div>
      <h2>保存新的恢复码</h2>
      <p>旧恢复码已失效。此新恢复码只显示一次。</p>
      <p id="passwordRecoveryRestartNotice" class="security-note" hidden>恢复已持久化，但安全存储需要重启后完成恢复。保存恢复码，然后关闭并重新打开 RouteNest。</p>
      <div class="recovery-code-box"><code id="passwordRecoveryReplacementCode" tabindex="0"></code><button type="button" class="btn btn-sm" onclick="copyRecoveryValue('passwordRecoveryReplacementCode', this)">复制</button></div>
      <label class="recovery-confirm"><input id="passwordRecoverySaved" type="checkbox" onchange="updatePasswordRecoveryFinish()"> <span>我已安全保存新的恢复码。</span></label>
      <button id="passwordRecoveryFinish" type="button" class="btn btn-primary btn-block" onclick="finishPasswordRecovery()" disabled>返回登录</button>
    </div>
  </section>
</div>
