<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="rnHexBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182238"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="rnAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8CFF"/>
      <stop offset="50%" stop-color="#7968F8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="rnGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4778E8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7968F8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base for App Icon -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#rnHexBg)" stroke="#2A3854" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#rnGlow)"/>

  <!-- Outer Hexagonal Nest Frame -->
  <path d="M64 22 L98 41.5 V80.5 L64 100 L30 80.5 V41.5 Z" 
        stroke="url(#rnAccentGrad)" stroke-width="5" stroke-linejoin="round" fill="none" opacity="0.45"/>

  <!-- Routing Pathways -->
  <!-- Main Ingress -->
  <path d="M30 64 H 56" stroke="url(#rnAccentGrad)" stroke-width="5" stroke-linecap="round"/>
  <!-- Branch to Upper Provider -->
  <path d="M56 64 C64 64, 68 46, 84 46 H92" stroke="url(#rnAccentGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  <!-- Center Direct Route -->
  <path d="M56 64 H92" stroke="url(#rnAccentGrad)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Branch to Lower Provider -->
  <path d="M56 64 C64 64, 68 82, 84 82 H92" stroke="url(#rnAccentGrad)" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Core Gateway Node (The Nest Hub) -->
  <circle cx="56" cy="64" r="7" fill="#FFFFFF"/>
  <circle cx="56" cy="64" r="10" stroke="url(#rnAccentGrad)" stroke-width="2.5" fill="none"/>

  <!-- Output Provider Endpoints -->
  <circle cx="92" cy="46" r="4.5" fill="#38BDF8"/>
  <circle cx="92" cy="64" r="4.5" fill="#7968F8"/>
  <circle cx="92" cy="82" r="4.5" fill="#43C995"/>
</svg>
