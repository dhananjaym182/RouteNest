name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Run unit and integration tests
        run: go test -count=1 ./...
      - name: Run vet
        run: go vet ./...
      - name: Run Windows persistence tests
        if: runner.os == 'Windows'
        run: go test -count=1 ./internal/platform -run "TestWindows|TestWriteFileAtomicDurable"

  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable the preinstalled Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gccDirectory = 'C:\msys64\mingw64\bin'
          if (-not (Test-Path "$gccDirectory\gcc.exe")) {
            throw "The Windows race runner does not provide the expected MinGW compiler."
          }
          $gccDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Run race detector
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find internal/admin/ui tools review-artifacts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Run JavaScript unit tests
        run: |
          node --test tools/*.test.mjs
          node tools/admin_delete_all_accounts.test.js
      - name: Verify localization contracts
        run: node tools/i18n_check.js

  browser:
    name: Authenticated admin browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/routenest-playwright" playwright@1.64.1
          "$RUNNER_TEMP/routenest-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build verification server
        shell: bash
        run: go build -trimpath -o "$RUNNER_TEMP/routenest-browser-verify" .
      - name: Run authenticated navigation and provider setup checks
        shell: bash
        env:
          ADMIN_TEST_BOOTSTRAP_SECRET: ci-browser-bootstrap-secret
          ADMIN_TEST_PASSWORD: ci-browser-admin-password
          BASE_URL: http://127.0.0.1:3467/admin/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/routenest-playwright/node_modules/playwright
        run: |
          set -euo pipefail
          data_dir=$(mktemp -d)
          log_file="$RUNNER_TEMP/routenest-browser-verify.log"
          ROUTENEST_DATA_DIR="$data_dir" \
          ROUTENEST_ADMIN_BOOTSTRAP_PASSWORD="$ADMIN_TEST_BOOTSTRAP_SECRET" \
          ROUTENEST_INITIALIZE_EMPTY_ACCOUNT_STORE=true \
          "$RUNNER_TEMP/routenest-browser-verify" -host 127.0.0.1 -port 3467 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3467/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:3467/ready >/dev/null || { sed -n '1,160p' "$log_file"; exit 1; }
          VERIFY_WIDTHS=1440,390 VERIFY_THEMES=light,dark node tools/admin_navigation_verify.mjs
          VERIFY_WIDTHS=1440,390 VERIFY_THEMES=light,dark node tools/admin_provider_setup_verify.mjs

  docker:
    name: Docker persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise the source Docker image
        run: bash scripts/docker-smoke.sh
