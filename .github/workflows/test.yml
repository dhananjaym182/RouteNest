name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Run unit and integration tests
        run: go test -mod=readonly -count=1 ./...
      - name: Compile desktop authentication paths
        run: go test -mod=readonly -tags desktop -count=1 .
      - name: Run vet
        run: go vet -mod=readonly ./...
      - name: Run Windows persistence tests
        if: runner.os == 'Windows'
        run: go test -mod=readonly -count=1 ./internal/platform -run "TestWindows|TestWriteFileAtomicDurable"

  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - name: Enable the preinstalled Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The race detector needs cgo and a C compiler. Runner images move the compiler between
          # releases, so use the one on PATH if there is one, then look in the known locations.
          $searched = @('C:\msys64\mingw64\bin', 'C:\msys64\ucrt64\bin', 'C:\mingw64\bin', 'C:\ProgramData\mingw64\mingw64\bin')
          $onPath = Get-Command gcc.exe -ErrorAction SilentlyContinue
          if ($onPath) {
            $gccDirectory = Split-Path -Parent $onPath.Source
          } else {
            $gccDirectory = $searched | Where-Object { Test-Path "$_\gcc.exe" } | Select-Object -First 1
          }
          if (-not $gccDirectory) {
            Write-Host "gcc.exe is not on PATH and was not found in: $($searched -join ', ')"
            throw "The Windows race runner does not provide a C compiler (gcc.exe)."
          }
          Write-Host "Using C compiler from $gccDirectory"
          $gccDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & "$gccDirectory\gcc.exe" --version
      - name: Run race detector
        run: go test -mod=readonly -race -count=1 ./...
      - name: Run desktop authentication race checks
        run: go test -mod=readonly -tags desktop -race -count=1 .

  frontend:
    name: Frontend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            node --check "$file"
          done < <(find desktop/setup internal/admin/ui tools review-artifacts -type f \( -name '*.js' -o -name '*.mjs' \) -print | sort)
      - name: Run JavaScript unit tests
        run: |
          node --test tools/*.test.mjs
          node tools/admin_delete_all_accounts.test.js
      - name: Verify localization contracts
        run: node tools/i18n_check.js

  desktop-ui:
    name: Desktop authentication UI simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: '22'
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/routenest-playwright" playwright@1.64.1
          "$RUNNER_TEMP/routenest-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify simulated desktop setup and login flows
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/routenest-playwright/node_modules/playwright
          DESKTOP_SETUP_URL: http://127.0.0.1:8765/
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory desktop/setup >"$RUNNER_TEMP/desktop-ui.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true; wait "$server_pid" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8765/", timeout=1)' >/dev/null 2>&1; then break; fi
            sleep 1
          done
          ARTIFACT_DIR="$RUNNER_TEMP/desktop-auth-simulation" node tools/desktop_setup_verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: desktop-auth-ui-simulation
          path: ${{ runner.temp }}/desktop-auth-simulation
          if-no-files-found: ignore

  browser:
    name: Authenticated admin browser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f
        with:
          node-version: '22'
      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/routenest-playwright" playwright@1.64.1
          "$RUNNER_TEMP/routenest-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - name: Build verification server
        shell: bash
        run: go build -mod=readonly -trimpath -o "$RUNNER_TEMP/routenest-browser-verify" .
      - name: Run authenticated navigation and provider setup checks
        shell: bash
        env:
          ADMIN_TEST_BOOTSTRAP_SECRET: ci-browser-bootstrap-secret
          ADMIN_TEST_PASSWORD: ci-browser-admin-password
          BASE_URL: http://127.0.0.1:3467/admin/
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/routenest-playwright/node_modules/playwright
        run: |
          set -euo pipefail
          data_dir=$(mktemp -d)
          log_file="$RUNNER_TEMP/routenest-browser-verify.log"
          ROUTENEST_DATA_DIR="$data_dir" \
          ROUTENEST_ADMIN_BOOTSTRAP_PASSWORD="$ADMIN_TEST_BOOTSTRAP_SECRET" \
          ROUTENEST_INITIALIZE_EMPTY_ACCOUNT_STORE=true \
          "$RUNNER_TEMP/routenest-browser-verify" -host 127.0.0.1 -port 3467 >"$log_file" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" >/dev/null 2>&1 || true
            wait "$server_pid" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:3467/ready >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS --max-time 2 http://127.0.0.1:3467/ready >/dev/null || { sed -n '1,160p' "$log_file"; exit 1; }
          VERIFY_WIDTHS=1440,390 VERIFY_THEMES=light,dark node tools/admin_navigation_verify.mjs
          VERIFY_WIDTHS=1440,390 VERIFY_THEMES=light,dark node tools/admin_provider_setup_verify.mjs
          ROUTENEST_SECURITY_VERIFY_MUTATIONS=1 \
          ARTIFACT_DIR="$RUNNER_TEMP/admin-security-journeys" \
          node tools/admin_security_journeys_verify.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: admin-security-browser-evidence
          path: ${{ runner.temp }}/admin-security-journeys
          if-no-files-found: ignore

  docker:
    name: Docker persistence smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build and exercise the source Docker image
        run: bash scripts/docker-smoke.sh
