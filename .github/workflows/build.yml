name: Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: Build (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact: routenest-desktop.exe
            ldflags: "-s -w -H windowsgui"
            arch: amd64
          - runner: macos-15
            artifact: routenest-desktop-darwin-arm64
            ldflags: "-s -w"
            arch: arm64
          - runner: ubuntu-22.04
            artifact: routenest-desktop-linux-amd64
            ldflags: "-s -w"
            arch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Compile desktop authentication tests
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
        run: go test -tags "desktop production" -run '^$' .

      - name: Build
        shell: bash
        env:
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && '-framework UniformTypeIdentifiers' || '' }}
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
          PLATFORM_LDFLAGS: ${{ matrix.ldflags }}
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          app_git_commit=$(git rev-parse --short HEAD)
          app_build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -tags "desktop production" -trimpath \
            -ldflags="-s -w -X routenest/internal/buildinfo.AppVersion=${APP_VERSION} -X routenest/internal/buildinfo.AppGitCommit=${app_git_commit} -X routenest/internal/buildinfo.AppBuildDate=${app_build_date} ${PLATFORM_LDFLAGS}" \
            -o "${{ matrix.artifact }}" .

      - name: Verify selfcheck
        shell: bash
        env:
          ROUTENEST_DATA_DIR: ${{ runner.temp }}/routenest-selfcheck
          ROUTENEST_ADMIN_BOOTSTRAP_PASSWORD: ci-selfcheck-only-bootstrap
        run: ./"${{ matrix.artifact }}" -selfcheck -initialize-empty-account-store

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  checksums:
    name: Checksums
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -name 'routenest-*' -print | sort | while IFS= read -r file; do
            printf '%s  %s\n' "$(sha256sum "$file" | awk '{print $1}')" "$(basename "$file")"
          done > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3

      - uses: actions/upload-artifact@v4
        with:
          name: routenest-checksums
          path: SHA256SUMS
          if-no-files-found: error

  release:
    name: Release
    needs: [build, checksums]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            routenest-desktop.exe/routenest-desktop.exe
            routenest-desktop-darwin-arm64/routenest-desktop-darwin-arm64
            routenest-desktop-linux-amd64/routenest-desktop-linux-amd64
            routenest-checksums/SHA256SUMS
