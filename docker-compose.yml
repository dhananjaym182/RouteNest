services:
  routenest:
    build: .
    container_name: routenest
    restart: unless-stopped
    ports:
      # Keep the backend private; terminate TLS in a local reverse proxy.
      - "127.0.0.1:3457:3457"
    volumes:
      # 数据目录整体挂载（账号/配置/用量统计等全部持久化），重建容器不丢数据
      - ./data:/app/data
      - ./override.md:/app/override.md:ro
    environment:
      - PORT=3457
      - CLINE_PROXY_HOST=0.0.0.0
      - ROUTENEST_DATA_DIR=/app/data
      - ROUTENEST_ADMIN_BOOTSTRAP_PASSWORD=${ROUTENEST_ADMIN_BOOTSTRAP_PASSWORD:-}
      - ROUTENEST_INITIALIZE_EMPTY_ACCOUNT_STORE=${ROUTENEST_INITIALIZE_EMPTY_ACCOUNT_STORE:-}
      - ROUTENEST_ADMIN_CANONICAL_URL=${ROUTENEST_ADMIN_CANONICAL_URL:-}
      - ROUTENEST_ADMIN_PROXY_MODE=${ROUTENEST_ADMIN_PROXY_MODE:-false}
      - ROUTENEST_ADMIN_TRUSTED_PROXY_CIDRS=${ROUTENEST_ADMIN_TRUSTED_PROXY_CIDRS:-}
      - ROUTENEST_ADMIN_HSTS=${ROUTENEST_ADMIN_HSTS:-false}
    healthcheck:
      # /health is process liveness; /ready also requires client-auth storage.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3457/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
